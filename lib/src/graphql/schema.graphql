  bindTrackRecord(input: BindTrackRecordInput!): BindTrackRecordPayload @requireAuth
  clearCachedImages(input: ClearCachedImagesInput!): ClearCachedImagesPayload! @requireAuth @requirePermissions(permission : [MANAGE_CACHE])
  clearCookiesAndCache(input: ClearCookiesAndCacheInput): ClearCookiesAndCachePayload! @requireAuth @requirePermissions(permission : [MANAGE_CACHE])
  clearDownloader(input: ClearDownloaderInput!): ClearDownloaderPayload @requireAuth @requirePermissions(permission : [DOWNLOAD_CHAPTERS])
  connectKoSyncAccount(input: ConnectKoSyncAccountInput!): KoSyncConnectPayload! @requireAuth
  createBackup(input: CreateBackupInput): CreateBackupPayload! @requireAuth
  createCategory(input: CreateCategoryInput!): CreateCategoryPayload @requireAuth
  "Issues a one-time recovery code bound to CreateRecoveryCodeInput.userId."
  createRecoveryCode(input: CreateRecoveryCodeInput!): CreateRecoveryCodePayload! @requireAuth @requirePermissions(permission : [MANAGE_USERS])
  "Issues a one-time registration code."
  createRegistrationCode(input: CreateRegistrationCodeInput!): CreateRegistrationCodePayload! @requireAuth @requirePermissions(permission : [MANAGE_USERS])
  deleteCategory(input: DeleteCategoryInput!): DeleteCategoryPayload @requireAuth
  deleteCategoryMeta(input: DeleteCategoryMetaInput!): DeleteCategoryMetaPayload @requireAuth
  deleteCategoryMetas(input: DeleteCategoryMetasInput!): DeleteCategoryMetasPayload @requireAuth
