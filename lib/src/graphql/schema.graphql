  deleteDownloadedChapter(input: DeleteDownloadedChapterInput!): DeleteDownloadedChapterPayload @requireAuth
  deleteDownloadedChapters(input: DeleteDownloadedChaptersInput!): DeleteDownloadedChaptersPayload @requireAuth
  deleteGlobalMeta(input: DeleteGlobalMetaInput!): DeleteGlobalMetaPayload @requireAuth
  deleteGlobalMetas(input: DeleteGlobalMetasInput!): DeleteGlobalMetasPayload @requireAuth
  deleteMangaMeta(input: DeleteMangaMetaInput!): DeleteMangaMetaPayload @requireAuth
  deleteMangaMetas(input: DeleteMangaMetasInput!): DeleteMangaMetasPayload @requireAuth
