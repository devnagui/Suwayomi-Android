

query ServerSettings {
    settings {
        ...SettingsDto
    }
}

query UserSettings {
    userSettings {
        ...UserSettingsDto
    }
}

query ExtensionStores {
    extensionStores {
        nodes {
            indexUrl
        }
    }
}

query ExistingLocalMangas($ids: [Int!]!) {
    mangas(filter: {id: {in: $ids}}, first: 100) {
        nodes {
            id
        }
    }
}
