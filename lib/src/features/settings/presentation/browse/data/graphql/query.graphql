

mutation UpdateSourceInParallel($maxSourcesInParallel: Int = 6) {
  setSettings(input: {settings: {maxSourcesInParallel: $maxSourcesInParallel}}) {
    settings {
      ...SettingsDto
    }
  }
}

mutation UpdateLocalSourcePath($localSourcePath: String!) {
  setSettings(input: {settings: {localSourcePath: $localSourcePath}}) {
    settings {
      ...SettingsDto
    }
  }
}

mutation AddExtensionStore($indexUrl: String!) {
  addExtensionStore(input: {indexUrl: $indexUrl}) {
    extensionStore {
      indexUrl
    }
  }
}

mutation RemoveExtensionStore($indexUrl: String!) {
  removeExtensionStore(input: {indexUrl: $indexUrl}) {
    __typename
  }
}
