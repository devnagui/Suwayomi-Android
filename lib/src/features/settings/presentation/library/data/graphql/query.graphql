

mutation UpdateMangaMetaData($updateMangas: Boolean = false) {
  setUserSettings(input: {userSettings: {updateMangas: $updateMangas}}) {
    userSettings {
      ...UserSettingsDto
    }
  }
}

mutation UpdateGlobalUpdateInterval($globalUpdateInterval: Float = 12) {
  setSettings(input: {settings: {globalUpdateInterval: $globalUpdateInterval}}) {
    settings {
      ...SettingsDto
    }
  }
}

mutation ToggleExcludeNotStarted($excludeNotStarted: Boolean = false) {
  setUserSettings(input: {userSettings: {excludeNotStarted: $excludeNotStarted}}) {
    userSettings {
      ...UserSettingsDto
    }
  }
}

mutation ToggleExcludeUnreadChapters($excludeUnreadChapters: Boolean = false) {
  setUserSettings(input: {userSettings: {excludeUnreadChapters: $excludeUnreadChapters}}) {
    userSettings {
      ...UserSettingsDto
    }
  }
}

mutation ToggleExcludeCompleted($excludeCompleted: Boolean = false) {
  setUserSettings(input: {userSettings: {excludeCompleted: $excludeCompleted}}) {
    userSettings {
      ...UserSettingsDto
    }
  }
}
