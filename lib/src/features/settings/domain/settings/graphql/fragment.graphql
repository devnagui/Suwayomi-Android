fragment SettingsDto on SettingsType {
    ...AutomaticBackupSettingsDto
    ...ServerBindingDto
    ...SocksProxyDto
    ...CloudFlareBypassDto
    ...MiscSettingsDto
    ...BrowserSettingsDto
    ...LibrarySettingsDto
    ...DownloadsSettingsDto
}

fragment AutomaticBackupSettingsDto on SettingsType {
  backupInterval
  backupPath
  backupTTL
  backupTime
}

fragment BrowserSettingsDto on SettingsType {
  maxSourcesInParallel
  localSourcePath
}

fragment CloudFlareBypassDto on SettingsType {
  flareSolverrEnabled
  flareSolverrSessionName
  flareSolverrSessionTtl
  flareSolverrTimeout
  flareSolverrUrl
}

fragment DownloadsSettingsDto on SettingsType {
  downloadAsCbz
  downloadsPath
}

fragment LibrarySettingsDto on SettingsType {
  globalUpdateInterval
}

fragment UserSettingsDto on UserSettingsType {
  updateMangas
  excludeCompleted
  excludeNotStarted
  excludeUnreadChapters
  autoDownloadNewChapters
  autoDownloadNewChaptersLimit
  excludeEntryWithUnreadChapters
}

fragment MiscSettingsDto on SettingsType {
  debugLogsEnabled
  systemTrayEnabled
}

fragment RestoreStatusDto on BackupRestoreStatus {
  mangaProgress
  state
  totalManga
}


fragment ServerBindingDto on SettingsType {
  ip
  port
}

fragment SocksProxyDto on SettingsType {
  socksProxyEnabled
  socksProxyHost
  socksProxyPassword
  socksProxyPort
  socksProxyUsername
  socksProxyVersion
}
