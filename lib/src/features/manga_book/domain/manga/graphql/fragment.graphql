fragment MangaDto on MangaType {
  age
  artist
  author
  chaptersAge
  chaptersLastFetchedAt
  description
  genre
  id
  initialized
  lastFetchedAt
  latestFetchedChapter {
    ...ChapterDto
  }
  latestUploadedChapter {
    ...ChapterDto
  }
  meta {
    key
    value
  }
  realUrl
  source {
    ...SourceDto
  }
  sourceId
  status
  thumbnailUrl
  thumbnailUrlLastFetched
  title
  user {
    ...MangaUserDto
    downloadCount
    lastReadChapter {
      ...ChapterDto
    }
    latestReadChapter {
      ...ChapterDto
    }
  }
  updateStrategy
  url
}

fragment MangaMetaDto on MangaMetaType {
  key,
  value,
  mangaId,
}


fragment MangaBaseDto on MangaType {
  age
  artist
  author
  chaptersLastFetchedAt
  description
  genre
  id
  initialized
  lastFetchedAt
  meta {
    key
    value
  }
  realUrl
  sourceId
  status
  thumbnailUrl
  thumbnailUrlLastFetched
  title
  user {
    ...MangaUserDto
  }
  updateStrategy
  url
}

fragment MangaUserDto on MangaUserType {
  inLibrary
  inLibraryAt
  unreadCount
}
