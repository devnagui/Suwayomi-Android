fragment DownloadDto on DownloadType {
    chapter {
        id
        name
        sourceOrder
        user {
            isDownloaded
        }
    }

    manga {
        id
        title
        user {
            downloadCount
        }
        thumbnailUrl
    }
    progress
    state
    tries
    position
}

fragment DownloadUpdateDto on DownloadUpdate {
    type
    download {
        ...DownloadDto
    }
}

fragment DownloadUpdatesDto on DownloadUpdates {
    state
    omittedUpdates
    updates {
        ...DownloadUpdateDto
    }
    initial {
        ...DownloadDto
    }
}
