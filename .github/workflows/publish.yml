name: Publish Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  android:
    name: Validate Android and build signed APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Configure Android signing
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        working-directory: android
        env:
          UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$UPLOAD_KEY"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          printf '%s' "$UPLOAD_KEY" | base64 --decode > app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' \
            "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD" > key.properties

      - name: Build APKs
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          flutter build apk --release
          flutter build apk --split-per-abi --release

      - name: Package APKs
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          BUILD_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          safe_build_name="$(printf '%s' "$BUILD_NAME" | tr -c 'A-Za-z0-9._-' '_')"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            name="$(basename "$apk")"
            cp "$apk" "dist/suwayomi-android-${safe_build_name}-${name}"
          done

      - name: Upload Android build artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: suwayomi-android-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

      - name: Remove temporary signing files
        if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        run: rm -f android/key.properties android/app/upload-keystore.jks
